spring.application.name=ms-usuarios
server.port=8090

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:usuarios_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.issuer=ms-usuarios

app.admin.correo=${ADMIN_CORREO:admin@ferreterialosmaestros.cl}
app.admin.password=${ADMIN_PASSWORD}
