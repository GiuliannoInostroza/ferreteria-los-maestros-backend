server.address=127.0.0.1
server.port=8091
spring.datasource.url=${CATALOGO_DB_URL}
spring.datasource.username=${CATALOGO_DB_USER}
spring.datasource.password=${CATALOGO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ms-usuarios
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}
