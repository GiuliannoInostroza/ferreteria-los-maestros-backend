spring.application.name=ms-catalogo
server.port=8091

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_catalogo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:catalogo_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=http://localhost:5173
app.jwt.issuer=ms-usuarios
